name: File jobs - verify source without deployment
on:
  push:
    branches: [codex/dev-member-export-minio]
  pull_request:
    branches: [development]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql@sha256:dab0a802b44617303694fb17d166501de279c3031ddeb28c56ecf7fcab5ef0da
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_ROOT_HOST: '%'
        ports: ['13316:3306']
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 --silent" --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: robertpablo/ap-framework
          ref: 264a9e5b2814b53bf8e0cbf4460918a2f8232d35
          token: ${{ secrets.TOKEN }}
          path: .framework
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ropabajo/docker-kubernetes-configs
          ref: 9eaf8f19a91a1288b12918caad6e5fc785f1766d
          token: ${{ secrets.TOKEN }}
          path: .schema
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - name: Build source packages and verify consumer
        shell: bash
        env:
          FILE_JOBS_TEST_MYSQL: 'Server=127.0.0.1;Port=13316;User ID=root;SslMode=None'
        run: |
          set -euo pipefail
          umask 077
          work=$(mktemp -d "$RUNNER_TEMP/framework-consumer.XXXXXXXX")
          trap 'rm -rf -- "$work"' EXIT
          mkdir "$work/feed"
          cat > "$work/public.config" <<'XML'
          <configuration><packageSources><clear/><add key="nuget.org" value="https://api.nuget.org/v3/index.json"/></packageSources></configuration>
          XML
          for module in primitives mediator core rabbitmq authz files minio swagger; do
            project=$(find "$GITHUB_WORKSPACE/.framework/$module" -maxdepth 2 -name 'Ropabajo.*.csproj' ! -name '*.Tests.csproj' -print)
            test -n "$project"
            dotnet restore "$project" --configfile "$work/public.config" --disable-parallel
            dotnet pack "$project" --no-restore -c Release -o "$work/feed"
          done
          cat > "$work/source.config" <<XML
          <configuration><packageSources><clear/><add key="SourceFramework" value="$work/feed"/><add key="nuget.org" value="https://api.nuget.org/v3/index.json"/></packageSources></configuration>
          XML
          export OBJECTS_SCHEMA_INIT_SQL="$GITHUB_WORKSPACE/.schema/docker-compose/mysql-db-object/db-init/init.sql"
          project=src/Ropabajo.Church.Sanluis.Objects.Api.Tests
          dotnet restore "$project" --configfile "$work/source.config" --disable-parallel
          dotnet test "$project" --no-restore -c Release --logger trx --results-directory "$GITHUB_WORKSPACE/test-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: file-jobs-tests-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
